<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Playgama iframe isolation test</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
      }
      iframe {
        border: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <!-- iframe TRẦN, allow ĐẦY ĐỦ như khách gửi (có cả fullscreen) -->
    <iframe
      src="https://playgama.com/export/game/bomb-pong-online?clid=p_5d89eb68-55d5-4821-9e31-7795c2f92046"
      allow="fullscreen; accelerometer; camera; clipboard-read; clipboard-write; screen-wake-lock; speaker-selection; web-share; geolocation; gyroscope; microphone; xr-spatial-tracking; autoplay; encrypted-media; picture-in-picture; payment; publickey-credentials-get; publickey-credentials-create; storage-access; attribution-reporting; browsing-topics"
      allowfullscreen
    ></iframe>
  </body>
</html>
