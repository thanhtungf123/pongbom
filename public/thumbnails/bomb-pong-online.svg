<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- center line -->
  <line x1="400" y1="40" x2="400" y2="410" stroke="#2a3a5c" stroke-width="4" stroke-dasharray="14 16"/>

  <!-- glow behind bomb -->
  <circle cx="400" cy="225" r="150" fill="url(#glow)"/>

  <!-- paddles -->
  <rect x="48" y="150" width="20" height="150" rx="10" fill="#4fd1ff"/>
  <rect x="732" y="150" width="20" height="150" rx="10" fill="#ff6b6b"/>

  <!-- bomb -->
  <circle cx="400" cy="235" r="56" fill="#141414"/>
  <circle cx="382" cy="217" r="16" fill="#3a3a3a"/>
  <rect x="396" y="168" width="10" height="24" rx="5" fill="#8a6b3a" transform="rotate(20 401 180)"/>
  <circle cx="420" cy="150" r="7" fill="#ffb703"/>
  <circle cx="420" cy="150" r="12" fill="#ff7a00" opacity="0.5"/>

  <!-- title -->
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="#e8eefc">BOMB PONG</text>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ff7a00" letter-spacing="3">ONLINE</text>
</svg>
